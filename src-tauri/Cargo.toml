[package]
name = "lattice"
version = "0.1.0"
description = "Lattice — Visual Identity & Account Graph"
authors = ["Lattice"]
edition = "2021"

[lib]
name = "lattice"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
napi-build = "2.1"

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4", "async", "tokio_rt", "serde-json"] }
napi-derive = "2.16"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.33", features = ["bundled-sqlcipher"] }
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
