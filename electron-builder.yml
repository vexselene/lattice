appId: com.lattice.app
productName: Lattice
directories:
  output: release
  buildResources: build

files:
  - package.json
  - electron/**/*
  - frontend/dist/**/*
  - native/index.js
  - native/index.d.ts
  - native/*.node
  - "!src-tauri/**"
  - "!backend/**"
  - "!frontend/src/**"
  - "!frontend/node_modules/**"
  - "!**/*.ts"
  - "!**/*.map"
  - "!tests/**"
  - "!docs/**"
  - "!.git/**"
  - "!.github/**"

asar: true
asarUnpack:
  - "**/*.node"

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
  icon: build/icon.png
  maintainer: Lattice
  synopsis: Visual Identity & Account Graph
  description: Lattice — Encrypted visual identity and account graph management application.

mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.utilities
  icon: build/icon.icns
  forceCodeSigning: false
  identity: null

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  forceCodeSigning: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lattice
